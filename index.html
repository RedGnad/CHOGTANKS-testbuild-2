<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | CHOGTANKS</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Firebase SDK Scripts (version compat pour WebGL) -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script>
      // Configuration Firebase pour ChogTanks
      const firebaseConfig = {
        apiKey: "AIzaSyBqMAWDFLsKSthpxhvFrLOa3Htzb0eeYl8",
        authDomain: "chogtanks.firebaseapp.com",
        projectId: "chogtanks",
        storageBucket: "chogtanks.appspot.com",
        messagingSenderId: "362253578630",
        appId: "1:362253578630:web:4f63c34258e0d32cbd3c07"

    <!-- ✅ NOUVEAU : CSS et JS pour forcer l'orientation paysage -->
    <style>
      /* Overlay stylé pour rotation */
      .orientation-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        color: white;
        font-family: 'Arial', sans-serif;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .orientation-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .rotate-icon {
        font-size: 80px;
        margin-bottom: 20px;
        animation: rotate 2s linear infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .orientation-text {
        font-size: 24px;
        margin-bottom: 10px;
        font-weight: bold;
      }

      .orientation-subtitle {
        font-size: 16px;
        opacity: 0.8;
        margin-bottom: 5px;
      }
    </style>
    
    <!-- Meta tags pour mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  </head>
  <body>
    <!-- ✅ NOUVEAU : Overlay pour forcer l'orientation paysage -->
    <div id="orientationOverlay" class="orientation-overlay">
      <div class="rotate-icon">📱</div>
      <div class="orientation-text">Tournez votre appareil</div>
      <div class="orientation-subtitle">Ce jeu nécessite le mode paysage</div>
      <div class="orientation-subtitle">Please rotate to landscape</div>
    </div>
    
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">CHOGTANKS</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      
      // Variable globale pour Unity Instance
      var unityInstance;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/chogtanks-testbuild-advanced.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/chogtanks-testbuild-advanced.data",
        frameworkUrl: buildUrl + "/chogtanks-testbuild-advanced.framework.js",
        codeUrl: buildUrl + "/chogtanks-testbuild-advanced.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ChogNFT",
        productName: "CHOGTANKS",
        productVersion: "1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((instance) => {
          unityInstance = instance;
          console.log("Unity Instance créée et assignée globalement");
          
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
    
    <!-- ✅ NOUVEAU : JavaScript pour gestion de l'orientation -->
    <script>
      function checkOrientation() {
        const isPortrait = window.innerHeight > window.innerWidth;
        const overlay = document.getElementById('orientationOverlay');
        const unityContainer = document.querySelector('#unity-container');
        
        // Seulement sur les appareils mobiles (largeur < 768px)
        if (isPortrait && window.innerWidth < 768) {
          console.log("[ORIENTATION] Mode portrait détecté sur mobile - Affichage overlay");
          
          // Afficher l'overlay
          overlay.classList.add('show');
          
          // Masquer le jeu Unity
          if (unityContainer) {
            unityContainer.style.display = 'none';
          }
          
          // Optionnel : Mettre en pause Unity si déjà lancé
          if (typeof unityInstance !== 'undefined' && unityInstance) {
            // unityInstance.SendMessage('GameManager', 'PauseGame');
          }
          
        } else {
          console.log("[ORIENTATION] Mode paysage OK - Masquage overlay");
          
          // Masquer l'overlay
          overlay.classList.remove('show');
          
          // Afficher le jeu Unity
          if (unityContainer) {
            unityContainer.style.display = 'block';
          }
          
          // Optionnel : Reprendre Unity
          if (typeof unityInstance !== 'undefined' && unityInstance) {
            // unityInstance.SendMessage('GameManager', 'ResumeGame');
          }
        }
      }

      // Event listeners pour détecter les changements d'orientation
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', function() {
        // Délai pour iOS qui met du temps à mettre à jour les dimensions
        setTimeout(checkOrientation, 100);
      });

      // Vérification initiale au chargement
      document.addEventListener('DOMContentLoaded', checkOrientation);
      window.addEventListener('load', checkOrientation);
      
      console.log("[ORIENTATION] Système d'orientation initialisé");
    </script>
  </body>
</html>
