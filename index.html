<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>CHOGTANKS WebGL</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <!-- Firebase scripts AVANT Unity -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    // Configuration Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyBqMAWDFLsKSthpxhvFrLOa3Htzb0eeYl8",
      authDomain: "chogtanks.firebaseapp.com", 
      projectId: "chogtanks",
      storageBucket: "chogtanks.appspot.com",
      messagingSenderId: "362253578630",
      appId: "1:362253578630:web:4f63c34258e0d32cbd3c07"
    };
    // Initialiser Firebase
    firebase.initializeApp(firebaseConfig);

    // Restaurer le wallet depuis localStorage
    try {
      window.currentWalletAddress = localStorage.getItem('chogtanks_wallet') || null;
      if (window.currentWalletAddress) {
        console.log("🔄 Wallet restauré depuis localStorage:", window.currentWalletAddress);
      }
    } catch (e) {}

    // Auth anonyme
    firebase.auth().signInAnonymously()
      .then(function(userCredential) {
        console.log("✅ Auth anonyme réussie, UID:", userCredential.user.uid);
        window.db = firebase.firestore();
      })
      .catch(function(error) {
        console.error("❌ Erreur d'auth:", error);
      });
  </script>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-full"></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    // Détection des erreurs
    window.addEventListener('error', function(event) {
      console.error("🚨 Erreur globale:", event.error);
    });

    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style = 'background: red; padding: 10px;';
      else {
        if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(function() {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/chogtanks-testbuild-advanced.loader.js";
    var config = {
      dataUrl: buildUrl + "/chogtanks-testbuild-advanced.data",
      frameworkUrl: buildUrl + "/chogtanks-testbuild-advanced.framework.js",
      codeUrl: buildUrl + "/chogtanks-testbuild-advanced.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "ChogNFT",
      productName: "CHOGTANKS",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    // Gestion responsive comme le template Unity officiel
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile : canvas plein écran, devicePixelRatio forcé à 1 pour éviter RenderTexture trop grande
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";
      config.devicePixelRatio = 1;
    } else {
      // Desktop : taille fixe
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    loadingBar.style.display = "block";
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
        window.unityInstance = unityInstance;
      }).catch((message) => {
        console.error("🚨 Erreur Unity:", message);
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
